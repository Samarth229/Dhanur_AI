<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meher Sweets · AI Assistant</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%237a1f2b'/%3E%3Cpath d='M14 40c6-14 30-14 36 0-8 6-28 6-36 0z' fill='%23e07b24'/%3E%3Ccircle cx='32' cy='24' r='5' fill='%23ffd27a'/%3E%3C/svg%3E">
<style>
  :root {
    --font: "Segoe UI", "Nirmala UI", "Noto Sans Devanagari", system-ui, sans-serif;
    --maroon: #7a1f2b;
    --maroon-dark: #5c1620;
    --saffron: #e07b24;
    --cream: #fdf6ec;
    --card: #ffffff;
    --border: #ecdfc9;
    --grey: #7a7268;
    --grey-light: #a89e90;
    --green: #2e7d32;
    --green-bg: #eaf6ea;
    --amber: #b06a00;
    --amber-bg: #fdf1de;
    --red: #b3261e;
    --red-bg: #fdecea;
    --focus: #2f7bd8;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --cream: #241512;
      --card: #35201d;
      --border: #4a302b;
      --grey: #cdbfb3;
      --grey-light: #93857a;
      --green-bg: #1c2e1d;
      --amber-bg: #3a2c14;
      --red-bg: #3a1f1d;
    }
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: var(--font);
    background: var(--cream);
    color: #2a1f1a;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #f2e9e2; }
  }

  body {
    display: flex;
    flex-direction: column;
    background-image: radial-gradient(var(--border) 1px, transparent 1px);
    background-size: 22px 22px;
  }

  :lang(hi) { line-height: 1.7; }

  .page {
    max-width: 820px;
    width: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    height: 100%;
    background: var(--cream);
  }

  header {
    background: linear-gradient(120deg, var(--maroon) 0%, var(--saffron) 100%);
    color: #fff;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    flex-shrink: 0;
  }
  .logo-icon { flex-shrink: 0; width: 40px; height: 40px; filter: drop-shadow(0 1px 2px rgba(0,0,0,0.25)); }
  .header-text { flex: 1; min-width: 0; }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 700; }
  .tagline { font-size: 0.75rem; opacity: 0.9; margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #3ee06a; box-shadow: 0 0 0 2px rgba(255,255,255,0.4); flex-shrink: 0; }

  #newChatBtn {
    background: rgba(255,255,255,0.18);
    color: #fff;
    border: 1px solid rgba(255,255,255,0.45);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    font-size: 0.82rem;
    font-family: var(--font);
    flex-shrink: 0;
  }
  #newChatBtn:hover { background: rgba(255,255,255,0.3); }
  #newChatBtn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .welcome-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px 18px 14px;
    box-shadow: 0 2px 10px rgba(122,31,43,0.06);
  }
  .welcome-card p { margin: 0 0 12px; line-height: 1.6; }
  .suggestions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  @media (max-width: 480px) {
    .suggestions { grid-template-columns: 1fr; }
  }
  .suggestion-card {
    background: var(--cream);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 12px;
    font-family: var(--font);
    font-size: 0.85rem;
    text-align: left;
    cursor: pointer;
    color: inherit;
  }
  .suggestion-card:hover { background: var(--border); }
  .suggestion-card:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  #chips {
    display: flex;
    gap: 8px;
    padding: 0 16px 10px;
    overflow-x: auto;
    flex-shrink: 0;
  }
  #chips.hidden { display: none; }
  .chip {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 0.78rem;
    font-family: var(--font);
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    color: inherit;
  }
  .chip:hover { background: var(--border); }
  .chip:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .bubble-row { display: flex; animation: rise 0.22s ease-out; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.bot { justify-content: flex-start; align-items: flex-end; gap: 8px; }

  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--maroon);
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .avatar svg { width: 18px; height: 18px; }

  .bubble-col { display: flex; flex-direction: column; max-width: 78%; }
  .bubble-row.user .bubble-col { align-items: flex-end; }

  .bubble {
    padding: 11px 14px;
    border-radius: 16px;
    white-space: pre-wrap;
    word-wrap: break-word;
    line-height: 1.5;
    font-size: 0.93rem;
  }
  .bubble.bot {
    background: var(--card);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
    box-shadow: 0 1px 4px rgba(122,31,43,0.06);
  }
  .bubble.user {
    background: linear-gradient(120deg, var(--saffron) 0%, #f0a24a 100%);
    color: #fff;
    border-top-right-radius: 4px;
  }
  .bubble.error {
    background: var(--red-bg);
    border: 1px solid #f0bdb8;
    color: var(--red);
  }

  .amount { font-weight: 700; color: var(--maroon); }
  @media (prefers-color-scheme: dark) {
    .amount { color: #ffb17a; }
  }
  .bubble.user .amount { color: #fff; text-decoration: underline; }

  .timestamp {
    font-size: 0.68rem;
    color: var(--grey-light);
    margin-top: 4px;
    padding: 0 4px;
  }

  .status-card {
    margin-top: 8px;
    border-radius: 12px;
    padding: 9px 12px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .status-card.success { background: var(--green-bg); color: var(--green); }
  .status-card.handoff { background: var(--amber-bg); color: var(--amber); }

  .debug-panel {
    margin-top: 8px;
    font-size: 0.68rem;
    color: var(--grey-light);
    border-top: 1px dashed var(--border);
    padding-top: 6px;
    line-height: 1.5;
  }
  .debug-panel div { margin-bottom: 2px; }

  .typing-row { display: flex; align-items: flex-end; gap: 8px; padding: 0 16px 8px; }
  .typing-row[hidden] { display: none; }
  .typing-bubble {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-top-left-radius: 4px;
    padding: 12px 16px;
    display: flex;
    gap: 4px;
  }
  .typing-bubble .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--grey-light);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-bubble .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  #inputBar {
    display: flex;
    align-items: flex-end;
    gap: 10px;
    padding: 12px 16px 16px;
    background: var(--cream);
    flex-shrink: 0;
  }
  #messageInput {
    flex: 1;
    resize: none;
    font-family: var(--font);
    font-size: 0.92rem;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 22px;
    max-height: 96px;
    background: var(--card);
    color: inherit;
    line-height: 1.4;
  }
  #messageInput:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  #messageInput:disabled { opacity: 0.6; }

  #sendBtn {
    background: var(--maroon);
    color: #fff;
    border: none;
    border-radius: 50%;
    width: 44px; height: 44px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  #sendBtn:hover:not(:disabled) { background: var(--maroon-dark); }
  #sendBtn:disabled { opacity: 0.5; cursor: not-allowed; }
  #sendBtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  #sendBtn svg { width: 18px; height: 18px; }
</style>
</head>
<body>
  <div class="page">
    <header>
      <svg class="logo-icon" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="30" fill="rgba(255,255,255,0.15)"/>
        <path d="M14 42c6-15 30-15 36 0-8 7-28 7-36 0z" fill="#ffd27a"/>
        <circle cx="32" cy="25" r="6" fill="#fff2cc"/>
        <path d="M32 15c2 3 2 6 0 8-2-2-2-5 0-8z" fill="#ffb347"/>
      </svg>
      <div class="header-text">
        <h1>Meher Sweets &amp; Namkeen</h1>
        <div class="tagline"><span class="status-dot" aria-hidden="true"></span><span>Fresh sweets since 1998 · Rajouri Garden, New Delhi</span></div>
      </div>
      <button id="newChatBtn" type="button" aria-label="Start a new chat">New chat</button>
    </header>

    <div id="messages" aria-live="polite"></div>
    <div id="typingRow" class="typing-row" hidden aria-hidden="true">
      <div class="avatar">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <path d="M14 42c6-15 30-15 36 0-8 7-28 7-36 0z" fill="#ffd27a"/>
          <circle cx="32" cy="25" r="6" fill="#fff2cc"/>
        </svg>
      </div>
      <div class="typing-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
    </div>

    <div id="chips" class="hidden"></div>

    <div id="inputBar">
      <textarea id="messageInput" rows="1" placeholder="Type your message… (English, हिंदी, Hinglish)" aria-label="Type your message"></textarea>
      <button id="sendBtn" type="button" aria-label="Send message">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M3 11.5L20 4l-7 17-2.5-7L3 11.5z" stroke="#fff" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

<script>
(function () {
  "use strict";

  var SUGGESTIONS = [
    { emoji: "🍬", text: "Price of 1 kg kaju katli?" },
    { emoji: "🎁", text: "60 small gift boxes kitna padega?" },
    { emoji: "🚚", text: "क्या आप 12 किलोमीटर दूर डिलीवरी करते हैं?" },
    { emoji: "🕙", text: "What time do you close?" }
  ];

  var DEBUG = /(?:^|[?&])debug=1(?:&|$)/.test(window.location.search);

  var AMOUNT_RE = /(₹\s?[0-9][0-9,]*(?:\.[0-9]+)?)/g;

  function newConversationId() {
    return "web-" + Math.random().toString(36).slice(2) + Date.now().toString(36);
  }

  var state = { conversationId: newConversationId(), started: false };

  var messagesEl = document.getElementById("messages");
  var inputEl = document.getElementById("messageInput");
  var sendBtn = document.getElementById("sendBtn");
  var typingRow = document.getElementById("typingRow");
  var newChatBtn = document.getElementById("newChatBtn");
  var chipsEl = document.getElementById("chips");

  function botAvatarSVG() {
    var svgNS = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(svgNS, "svg");
    svg.setAttribute("viewBox", "0 0 64 64");
    svg.setAttribute("aria-hidden", "true");
    var path = document.createElementNS(svgNS, "path");
    path.setAttribute("d", "M14 42c6-15 30-15 36 0-8 7-28 7-36 0z");
    path.setAttribute("fill", "#ffd27a");
    var circle = document.createElementNS(svgNS, "circle");
    circle.setAttribute("cx", "32"); circle.setAttribute("cy", "25"); circle.setAttribute("r", "6");
    circle.setAttribute("fill", "#fff2cc");
    svg.appendChild(path);
    svg.appendChild(circle);
    return svg;
  }

  function makeAvatar() {
    var avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.appendChild(botAvatarSVG());
    return avatar;
  }

  function timeString() {
    var d = new Date();
    var hh = String(d.getHours()).padStart(2, "0");
    var mm = String(d.getMinutes()).padStart(2, "0");
    return hh + ":" + mm;
  }

  function makeTimestamp() {
    var ts = document.createElement("div");
    ts.className = "timestamp";
    ts.appendChild(document.createTextNode(timeString()));
    return ts;
  }

  function scrollToBottom() {
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  function clearWelcome() {
    if (state.started) return;
    state.started = true;
    messagesEl.textContent = "";
    chipsEl.classList.remove("hidden");
  }

  function appendAmountAwareText(container, text) {
    var parts = String(text).split(AMOUNT_RE);
    for (var i = 0; i < parts.length; i++) {
      var part = parts[i];
      if (part === "") continue;
      if (i % 2 === 1) {
        var span = document.createElement("span");
        span.className = "amount";
        span.appendChild(document.createTextNode(part));
        container.appendChild(span);
      } else {
        container.appendChild(document.createTextNode(part));
      }
    }
  }

  function addUserBubble(text) {
    var row = document.createElement("div");
    row.className = "bubble-row user";
    var col = document.createElement("div");
    col.className = "bubble-col";
    var bubble = document.createElement("div");
    bubble.className = "bubble user";
    bubble.appendChild(document.createTextNode(text));
    col.appendChild(bubble);
    col.appendChild(makeTimestamp());
    row.appendChild(col);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addErrorBubble(text) {
    var row = document.createElement("div");
    row.className = "bubble-row bot";
    row.appendChild(makeAvatar());
    var col = document.createElement("div");
    col.className = "bubble-col";
    var bubble = document.createElement("div");
    bubble.className = "bubble error";
    bubble.appendChild(document.createTextNode(text));
    col.appendChild(bubble);
    col.appendChild(makeTimestamp());
    row.appendChild(col);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addStatusCard(bubble, kind, text) {
    var card = document.createElement("div");
    card.className = "status-card " + kind;
    card.appendChild(document.createTextNode(text));
    bubble.appendChild(card);
  }

  function addDebugPanel(bubble, data) {
    if (!DEBUG) return;
    var panel = document.createElement("div");
    panel.className = "debug-panel";

    var sources = data.sources || [];
    if (sources.length) {
      var srcLine = document.createElement("div");
      srcLine.appendChild(document.createTextNode("sources: " + sources.join(", ")));
      panel.appendChild(srcLine);
    }

    var actions = data.actions || [];
    if (actions.length) {
      actions.forEach(function (action) {
        var actLine = document.createElement("div");
        var type = String(action.type || "action");
        var args = "";
        try {
          args = JSON.stringify(action.args || {});
        } catch (e) {
          args = "";
        }
        actLine.appendChild(document.createTextNode("action: " + type + " " + args));
        panel.appendChild(actLine);
      });
    }

    var usage = data.usage || {};
    if (usage.latency_ms !== undefined || usage.model_calls !== undefined) {
      var usageLine = document.createElement("div");
      var latency = usage.latency_ms !== undefined ? Math.round(usage.latency_ms) + " ms" : "?";
      var calls = usage.model_calls !== undefined ? usage.model_calls : "?";
      usageLine.appendChild(document.createTextNode(latency + " · " + calls + " model call(s)"));
      panel.appendChild(usageLine);
    }

    if (panel.childNodes.length) bubble.appendChild(panel);
  }

  function addBotBubble(data) {
    var row = document.createElement("div");
    row.className = "bubble-row bot";
    row.appendChild(makeAvatar());
    var col = document.createElement("div");
    col.className = "bubble-col";
    var bubble = document.createElement("div");
    bubble.className = "bubble bot";

    appendAmountAwareText(bubble, data.reply || "");

    var actions = data.actions || [];
    var savedLead = actions.some(function (a) { return a.type === "save_lead"; });
    if (savedLead) {
      addStatusCard(bubble, "success", "✅ Your details are saved. Our team will contact you soon.");
    }
    if (data.handoff) {
      addStatusCard(bubble, "handoff", "🤝 Connected to our team. They will reply by email within one working day.");
    }

    addDebugPanel(bubble, data);

    col.appendChild(bubble);
    col.appendChild(makeTimestamp());
    row.appendChild(col);
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function setBusy(busy) {
    sendBtn.disabled = busy;
    inputEl.disabled = busy;
    typingRow.hidden = !busy;
    if (busy) scrollToBottom();
  }

  function sendMessage(text) {
    text = text.trim();
    if (!text) return;

    clearWelcome();
    addUserBubble(text);
    inputEl.value = "";
    autoResize();
    setBusy(true);

    fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ conversation_id: state.conversationId, message: text })
    })
      .then(function (resp) {
        if (!resp.ok) {
          throw new Error("Server returned " + resp.status);
        }
        return resp.json();
      })
      .then(function (data) {
        addBotBubble(data);
      })
      .catch(function () {
        addErrorBubble("Sorry, something went wrong. Please try again.");
      })
      .finally(function () {
        setBusy(false);
        inputEl.focus();
      });
  }

  function autoResize() {
    inputEl.style.height = "auto";
    inputEl.style.height = Math.min(inputEl.scrollHeight, 96) + "px";
  }

  function buildWelcome() {
    messagesEl.textContent = "";
    var card = document.createElement("div");
    card.className = "welcome-card";
    var p = document.createElement("p");
    p.appendChild(document.createTextNode(
      "Namaste! 🙏 I'm the AI assistant for Meher Sweets. Ask me about prices, orders, delivery or Diwali gift boxes, in English, हिंदी or Hinglish."
    ));
    card.appendChild(p);

    var grid = document.createElement("div");
    grid.className = "suggestions";
    SUGGESTIONS.forEach(function (s) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "suggestion-card";
      btn.appendChild(document.createTextNode(s.emoji + " " + s.text));
      btn.addEventListener("click", function () { sendMessage(s.text); });
      grid.appendChild(btn);
    });
    card.appendChild(grid);

    messagesEl.appendChild(card);
  }

  function buildChips() {
    chipsEl.textContent = "";
    SUGGESTIONS.forEach(function (s) {
      var chip = document.createElement("button");
      chip.type = "button";
      chip.className = "chip";
      chip.appendChild(document.createTextNode(s.emoji + " " + s.text));
      chip.addEventListener("click", function () { sendMessage(s.text); });
      chipsEl.appendChild(chip);
    });
  }

  sendBtn.addEventListener("click", function () {
    sendMessage(inputEl.value);
  });

  inputEl.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage(inputEl.value);
    }
  });

  inputEl.addEventListener("input", autoResize);

  newChatBtn.addEventListener("click", function () {
    state.conversationId = newConversationId();
    state.started = false;
    chipsEl.classList.add("hidden");
    buildWelcome();
  });

  buildChips();
  buildWelcome();
  inputEl.focus();
})();
</script>
</body>
</html>
