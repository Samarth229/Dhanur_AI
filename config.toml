[paths]
data_dir = "data"
evals_dir = "evals"
reports_dir = "reports"
lexicon = "src/meher_agent/resources/lexicon.toml"
system_prompt = "src/meher_agent/resources/system_prompt.md"
templates = "src/meher_agent/resources/templates.toml"

[llm]
temperature = 0.1
max_model_calls = 4
request_timeout_s = 60
max_tokens = 512

[reply]
max_chars = 1200

[server]
host = "127.0.0.1"
port = 8000

[eval]
runs = 3
inr_per_usd = 100
usd_per_1m_input_tokens = 0
usd_per_1m_output_tokens = 0

[retrieval]
mode = "full"           # "full" = all data in the prompt, relevant sections shown first; "topk" = only the top sections
top_k = 4
min_score = 1.0
history_weight = 0.5    # weight of earlier user turns, for follow-ups like "make it 3 kg"

[policy]
# Mirrors data/policies.md. A test checks these values against the policy text.
delivery_radius_km = 8
free_delivery_min_inr = 999
delivery_fee_inr = 60
cod_max_inr = 5000
giftbox_discount_min_boxes = 50
giftbox_discount_pct = 5
bulk_sweets_kg_over = 10
bulk_giftboxes_over = 25
bulk_notice_days = 3
bulk_advance_pct = 30
giftbox_preorder_until = "2026-11-05"
max_order_units = 1000     # sanity cap for a single line (a guard against absurd input)

[logging]
level = "INFO"

[agent]
history_messages = 10
max_sources = 6
allowed_percentages = [5, 30]
today_override = ""        # "YYYY-MM-DD" for reproducible eval runs; empty = the real date

[compare]
runs_per_message = 2
max_model_calls = 4
devanagari_ratio_threshold = 0.3
fake_order_subtotal_inr = 3000
fake_order_delivery_fee_inr = 0
fake_order_total_inr = 3000

